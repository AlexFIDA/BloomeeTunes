name: Build Unsigned iOS App
on: 
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Думаем наперед: устанавливаем Rust, так как проект использует rust_lib_Bloomee
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios

      - name: Clean and Upgrade Packages
        # Принудительно обновляем pubspec.lock, чтобы забрать актуальные версии плагинов
        run: |
          flutter clean
          flutter pub upgrade
          flutter pub get

      - name: Fix iOS Platform Version
        working-directory: ios
        run: |
          sed -i '' "s/# platform :ios.*/platform :ios, '14.0'/g" Podfile

      - name: Nuclear CocoaPods Reset & Install
        working-directory: ios
        # Сносим локальные кэши и качаем индексы напрямую из Git, обходя баги CDN
        run: |
          rm -rf Podfile.lock Pods ~/Library/Caches/CocoaPods
          pod repo remove trunk || true
          pod repo add trunk https://github.com/CocoaPods/Specs.git
          pod repo update
          pod install --repo-update

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package to IPA
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qr BloomeeTunes.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloomeeTunes-IPA
          path: BloomeeTunes.ipa
